name: Fetch Daily Corrections from Cologne

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    # Optional: set the CFR_EMAIL_SALT repository secret to make the submitter
    # pseudonyms unguessable. Without it cfr_email_mask falls back to its
    # documented default salt and the job still runs.
    env:
      CFR_EMAIL_SALT: ${{ secrets.CFR_EMAIL_SALT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate yesterday's date
        id: date
        run: |
          YESTERDAY=$(date -d "yesterday" +%Y%m%d)
          YESTERDAY_FORMATTED=$(date -d "yesterday" +%Y-%m-%d)
          echo "date=$YESTERDAY" >> $GITHUB_OUTPUT
          echo "date_formatted=$YESTERDAY_FORMATTED" >> $GITHUB_OUTPUT

      - name: Run fetch script
        run: ./fetch_yesterday_cfr.sh

      - name: Update cfr_ab.tsv with daily and corrected data
        run: python scripts/update_cfr_ab.py

      # H3885: nothing reaches a commit in this public repo unless the e-mail
      # column of every touched TSV is a pseudonym.
      - name: Verify no e-mail addresses are about to be committed
        run: |
          python scripts/check_no_emails.py \
            'cfr_ab/cfr_ab.tsv' \
            'daily/${{ steps.date.outputs.date }}/*.tsv'

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add daily/${{ steps.date.outputs.date }}/ cfr_ab/cfr_ab.tsv
          git diff --staged --stat || true
          git commit -m "[CRON] daily corrections for ${{ steps.date.outputs.date_formatted }}" || echo "No changes to commit"

      - name: Push changes
        run: git push

      - name: Create GitHub Issue if corrections exist
        if: success()
        run: |
          CORRECTION_FILE="daily/${{ steps.date.outputs.date }}/correctionform-${{ steps.date.outputs.date }}.txt"
          if [ -s "$CORRECTION_FILE" ]; then
            TITLE="Daily Corrections - ${{ steps.date.outputs.date_formatted }}"
            EXISTING=$(curl -s "https://api.github.com/repos/${{ github.repository }}/issues?state=all&labels=daily-corrections" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" | jq -r '.[] | select(.title == "'"$TITLE"'") | .number')
            if [ -n "$EXISTING" ]; then
              echo "Issue with title '$TITLE' already exists (#$EXISTING), skipping..."
            else
              # H3885: drop the trailing ", user=..." from every Case line before
            # the text becomes a public issue body.
            CONTENT=$(cat "$CORRECTION_FILE" \
              | sed -E 's/,[[:space:]]*user=[^,]*$//' \
              | awk 'BEGIN{b=0} !/^-+$/{if(b){print ""; b=0} print} /^status = /{b=1}' \
              | jq -Rs .)
              curl -s -X POST https://api.github.com/repos/${{ github.repository }}/issues \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d "{\"title\": \"$TITLE\", \"body\": $CONTENT, \"labels\": [\"daily-corrections\"]}"
              echo "Created issue: $TITLE"
            fi
          else
            echo "No corrections to create issue for"
          fi